# Written by `npx suparace init --ci` to .github/workflows/suparace.yml.
# Runs your race files (written by `npx suparace init`) against a throwaway local Supabase stack on the
# GitHub runner, and fails the job when a race breaks an invariant.
name: suparace
on:
  pull_request:
  workflow_dispatch:

jobs:
  races:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: phillipabell/suparace@v0.3.0   # a release tag, so a later change to main cannot change your CI
        with:
          target: local
          sql: suparace/quickstart.sql          # your schema + the functions under test
          races: suparace
          race: spend:atomic                    # spend:naive is the known bug: it fails on purpose
          n: "50"
          runs: "3"

  # Against a throwaway Free plan project instead (never production data): replace the job above with this one,
  # after adding the repo secrets SUPARACE_URL and SUPARACE_SERVICE_ROLE_KEY.
